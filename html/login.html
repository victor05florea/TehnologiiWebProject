<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="../media/Logo-FMI.png" alt="Imagine login">
        </div>
        <div class="separator"></div>
        <form class="login-form" action="#" method="post">
            <h2>Autentificare</h2>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nume@exemplu.com" required>
            <label for="password">Parola</label>
            <input type="password" id="password" name="password" placeholder="Parola" required>
            <button type="submit">Login</button>
            <p class="register-text">
                Nu ai cont? <a href="register.html">Înregistrează-te</a>
            </p>
        </form>
    </div>
</body>
</html>
