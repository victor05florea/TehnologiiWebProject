<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Înregistrare</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/register_style.css">
</head>
<body class="register-page">
  <main class="register-card">
    <header class="register-header">
      <h1>Creează un cont</h1>
      <p>Completează datele de mai jos pentru a te înregistra.</p>
    </header>

    <form class="register-form" action="#" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="form-field">
          <label for="username">Nume utilizator</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 placeholder="Ex.: Alex" required>
        </div>

        <div class="form-field">
          <label for="email">Adresă de email</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 placeholder="nume@exemplu.com" required>
        </div>

        <div class="form-field">
          <label for="password">Parolă</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>

        <div class="form-field">
          <label for="confirm_password">Confirmă parola</label>
          <input type="password" id="confirm_password" name="confirm_password"
                 autocomplete="new-password" required>
        </div>

        <div class="form-field">
          <label for="birthdate">Data nașterii</label>
          <input type="date" id="birthdate" name="birthdate">
        </div>

        <div class="form-field">
          <label for="country">Țară</label>
          <select id="country" name="country">
            <option value="">Selectează țara</option>
            <option value="ro">România</option>
            <option value="md">Republica Moldova</option>
            <option value="other">Altă țară</option>
          </select>
        </div>
      </div>

      <fieldset class="form-group">
        <legend>Gen</legend>
        <div class="choice-list">
          <label class="choice"><input type="radio" name="gender" value="female"> Femeie</label>
          <label class="choice"><input type="radio" name="gender" value="male"> Bărbat</label>
          <label class="choice"><input type="radio" name="gender" value="other"> Prefer să nu spun</label>
        </div>
      </fieldset>

      <fieldset class="form-group">
        <legend>Interese</legend>
        <div class="choice-list">
          <label class="choice"><input type="checkbox" name="interests" value="web"> Tehnologii web</label>
          <label class="choice"><input type="checkbox" name="interests" value="design"> Design</label>
          <label class="choice"><input type="checkbox" name="interests" value="other"> Altele</label>
        </div>
      </fieldset>

      <div class="form-field">
        <label for="avatar">Fotografie de profil <span class="optional">(opțional)</span></label>
        <input type="file" id="avatar" name="avatar" accept="image/*">
      </div>

      <div class="form-field">
        <label for="bio">Despre tine <span class="optional">(opțional)</span></label>
        <textarea id="bio" name="bio" rows="3" placeholder="Scrie câteva cuvinte despre tine"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-button">Creează cont</button>
        <button type="reset" class="reset-button">Resetează</button>
      </div>
    </form>

    <p class="login-link">Ai deja cont? <a href="login.html">Autentifică-te</a></p>
  </main>
</body>
</html>
